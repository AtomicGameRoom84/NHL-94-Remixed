[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "genesis-toolkit"
version = "0.1.0"
description = "Generic disassembly/reassembly toolkit for Sega Genesis / Mega Drive ROMs"
requires-python = ">=3.10"
dependencies = ["capstone>=5.0"]

[project.optional-dependencies]
# `pip install -e ".[test]"` to get the test runner too. Without this a
# clean install has no pytest, and the documented `python -m pytest`
# fails with "No module named pytest" on a fresh checkout.
test = ["pytest>=7"]

[project.scripts]
genesis-toolkit = "genesis_toolkit.cli:main"

[tool.setuptools]
packages = ["genesis_toolkit"]
