name: Build Windows exe

# A Windows .exe has to be built on Windows -- PyInstaller doesn't
# cross-compile -- so this runs on GitHub's Windows machines and leaves
# a downloadable zip behind. That lets someone use the toolkit with no
# Python installed at all.
on:
  workflow_dispatch:        # "Run workflow" button in the Actions tab
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write           # needed only to attach the zip to a release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install the toolkit and PyInstaller
        # The extras form has to be quoted -- unquoted, pip reads
        # ".[test]" as a dependency specifier and rejects it rather than
        # treating it as a path.
        run: |
          python -m pip install --upgrade pip
          pip install ".[test]"
          pip install pyinstaller
        working-directory: toolkit

      - name: Run the tests before packaging anything
        run: python -m pytest -q
        working-directory: toolkit

      - name: Build genesis-toolkit.exe (command line)
        run: |
          pyinstaller --onefile --name genesis-toolkit `
            --paths . `
            --hidden-import genesis_toolkit.selftest `
            --collect-all capstone `
            packaging/entry.py
        working-directory: toolkit

      - name: Build RinkEditor.exe (the window)
        # --windowed: no console box behind the GUI. The data map is
        # bundled inside the exe so the editor works from any folder,
        # with no loose files to lose.
        run: |
          pyinstaller --onefile --windowed --name RinkEditor `
            --paths . `
            --collect-all capstone `
            --add-data "maps;maps" `
            packaging/gui_entry.py
        working-directory: toolkit

      - name: Smoke-test the exe
        # A binary that builds but can't disassemble is worse than no
        # binary, and capstone's native library is the part most likely
        # to go missing in a frozen build -- so actually disassemble
        # something. The synthetic fixture the unit tests use works
        # here too, and keeps this honest without needing a real game.
        run: |
          python -c "import sys; sys.path.insert(0,'.'); from tests.fixtures.make_fixture import build_fixture_rom; open('ci-fixture.md','wb').write(build_fixture_rom())"
          .\dist\genesis-toolkit.exe --help
          if ($LASTEXITCODE -ne 0) { exit 1 }
          .\dist\genesis-toolkit.exe selftest ci-fixture.md
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Remove-Item ci-fixture.md
        working-directory: toolkit

      - name: Check the editor exe starts and finds its data map
        # A GUI can't be clicked in CI, but it can be imported and asked
        # whether the bundled map resolved -- the one thing that breaks
        # when data files don't make it into a frozen build.
        run: |
          python -c "from genesis_toolkit.gui import _default_map_path; p=_default_map_path(); print('map:', p); assert p, 'data map not found'"
          if ($LASTEXITCODE -ne 0) { exit 1 }
        working-directory: toolkit

      - name: Assemble the release bundle
        run: |
          New-Item -ItemType Directory -Force -Path bundle | Out-Null
          Copy-Item toolkit\dist\RinkEditor.exe bundle\
          Copy-Item toolkit\dist\genesis-toolkit.exe bundle\
          Copy-Item -Recurse toolkit\maps bundle\maps
          Copy-Item GETTING-STARTED.md bundle\
          Copy-Item README.md bundle\
          Compress-Archive -Path bundle\* -DestinationPath genesis-toolkit-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: genesis-toolkit-windows
          path: genesis-toolkit-windows.zip
          retention-days: 90

      - name: Attach to the release when a tag was pushed
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: genesis-toolkit-windows.zip
